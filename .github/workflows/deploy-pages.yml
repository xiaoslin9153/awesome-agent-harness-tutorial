name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-starlight/package-lock.json
      - run: npm ci
        working-directory: site-starlight
      - run: npm run build
        working-directory: site-starlight
        env:
          SITE_BASE_URL: /${{ github.event.repository.name }}/
      - name: Check markdown links
        run: npm run check:links
        working-directory: site-starlight
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-starlight/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
